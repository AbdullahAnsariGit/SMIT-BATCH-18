<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Cards</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-10">

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl w-full">

        <!-- Card 1 -->
        <div
            class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-2xl transition duration-300 border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">
                Alex
            </h1>

            <p class="text-gray-600 mb-5">
                alex@gmail.com
            </p>

            <button
                class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg transition duration-300">
                Check
            </button>
        </div>

        <!-- Card 2 -->
        <div
            class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-2xl transition duration-300 border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">
                John
            </h1>

            <p class="text-gray-600 mb-5">
                john@gmail.com
            </p>

            <button
                class="bg-green-500 hover:bg-green-600 text-white px-5 py-2 rounded-lg transition duration-300">
                Check
            </button>
        </div>

        <!-- Card 3 -->
        <div
            class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-2xl transition duration-300 border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">
                Micheal
            </h1>

            <p class="text-gray-600 mb-5">
                micheal@gmail.com
            </p>

            <button
                class="bg-purple-500 hover:bg-purple-600 text-white px-5 py-2 rounded-lg transition duration-300">
                Check
            </button>
        </div>

        <!-- Card 4 -->
        <div
            class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-2xl transition duration-300 border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">
                Bred
            </h1>

            <p class="text-gray-600 mb-5">
                bred@gmail.com
            </p>

            <button
                class="bg-red-500 hover:bg-red-600 text-white px-5 py-2 rounded-lg transition duration-300">
                Check
            </button>
        </div>

        <!-- Card 5 -->
        <div
            class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-2xl transition duration-300 border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">
                Nourz
            </h1>

            <p class="text-gray-600 mb-5">
                nourz@gmail.com
            </p>

            <button
                class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2 rounded-lg transition duration-300">
                Check
            </button>
        </div>

    </div>

</body>

</html>
